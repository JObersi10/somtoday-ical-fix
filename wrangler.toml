name = "somtoday-fix"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# kv_namespaces MUST come before any [table] header below (like [vars] or
# [triggers]) — in TOML, once a [table] is opened, every bare key after it
# belongs to that table. Had this after [vars] earlier, which silently
# became vars.kv_namespaces instead of the top-level binding Wrangler
# expects, so the STATE binding never actually attached at runtime.
kv_namespaces = [
  { binding = "STATE", id = "c202165d9dc444fb88f75d34ec00712a" }
]

# Non-secret: safe to commit. This is your Somtoday leerling (student) ID,
# not a credential — it's derivable from your own account and appears in
# plain request URLs already. Kept here (not as a dashboard "Variable")
# because a dashboard-only Variable gets reset to whatever wrangler.toml
# declares on every git-triggered deploy — only Secrets survive that.
# The actual secret (SOMTODAY_REFRESH_TOKEN) must NOT go here — set it via
# Cloudflare dashboard -> Worker -> Settings -> Variables and secrets ->
# Add variable -> type "Secret". That one does persist across deploys.
[vars]
SOMTODAY_LEERLING_ID = "7361428924143"
# Must match whichever client the SOMTODAY_REFRESH_TOKEN secret was actually
# issued to. Currently the mobile app's native client (60-day refresh token
# lifetime, vs. 8 hours for "somtoday-leerling-web"). Belongs here, not just
# a dashboard Variable, for the same reason as SOMTODAY_LEERLING_ID above —
# see HANDOFF.md for the incident where this got silently wiped by a deploy.
SOMTODAY_CLIENT_ID = "somtoday-leerling-native"
# ntfy.sh topic for cancellation + sync-failure push notifications (see
# src/notify.ts). Not a real secret, but keep it out of anything public —
# anyone who knows the topic name can publish fake notifications to it.
NTFY_TOPIC = "somtoday-jaden-4d9ea36b"

# Runs the sync automatically every 30 minutes, independent of whether your
# calendar app happens to be polling — this is what "runs automatically"
# means here: no server to keep alive, Cloudflare just invokes scheduled()
# on this cadence forever, for free (well within the free tier's limits).
[triggers]
crons = ["*/30 * * * *"]

# All secrets below are set with:  wrangler secret put NAME
# (or pasted into Settings -> Variables and Secrets in the dashboard)
#
#   SOMTODAY_REFRESH_TOKEN captured refresh_token (recommended auth mode)
#   SOMTODAY_ICAL_URL      fallback public iCal feed URL (used only if no API creds set)
#   HOMEWORK_HOUR          local AST hour (0-23) for homework reminders, default 16
#   CAL_TOKEN              optional shared secret; if set, callers must add ?token=...
